<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.1.13/index.global.js"
      integrity="sha512-RAOoTi4JqATUmfyj+oyxwAo3JtUeZwLsBpNisDcY5VzvXZARuuaE5zfwUCDVa2LBBUax70uBlO4+eZA1Y/tk0A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      ></script>

    <script type="module" src="main.js"></script>

    <script>
      function generateButtonOnClick() {
        const baseURL = document.getElementById("baseURL").value
        const pid = document.getElementById("projectID").value
        const issueType = document.getElementById("issueType").value
        const priority = document.getElementById("priority").value
        const summary = document.getElementById("summary").value
        const description = document.getElementById("description").value
        const jira = {
          baseURL: baseURL,
          projectID: pid,
          issueType: issueType,
          priority: priority,
          summary: summary,
          description: description,
          labels: [], // TODO
        }
        const url = window.mainApp.generateURL(jira)
        document.getElementById('output').value = url
      }
    </script>

    <title>JIRA ISSUE URL GENERATOR</title>
  </head>

  <body class="flex flex-col items-center justify-between bg-slate-100">
    <header class="w-2/3 text-center p-8">
      <h1 class="text-xl">JIRA ISSUE URL GENERATOR</h1>
    </header>

    <div class="border rounded p-1 w-2/3">
      <section class="border-b-2 border-dotted p-2">
        <h2 class="text-xl p-2">Input</h2>

        <div class="flex">
          <label for="param" class="inline-block w-1/2 m-1">
            Set parameters from JIRA URL
          </label>
          <input id="param" type="text" class="bg-white w-1/2 m-1 p-1 rounded" placeholder="https://example.com/secure/CreateIssueDetails!init.jspa?pid=1&issuetype=1&priority=3&summary=hello_world"/>
        </div>

        <div class="flex">
          <span class="inline-block w-1/2 m-1"></span>
          <button class="bg-slate-900 text-white rounded w-1/2 m-1">Apply</button>
        </div>

        <div class="flex">
          <label for="baseURL" class="inline-block w-1/2 m-1">
            Jira Base URL
          </label>
          <input id="baseURL" type="text" class="bg-white w-1/2 m-1 p-1 rounded" placeholder="https://example.com" />
        </div>

        <div class="flex">
          <label for="projectID" class="inline-block w-1/2 m-1">
            Project ID
          </label>
          <input id="projectID" type="number" class="bg-white w-1/2 m-1 p-1 rounded" value="1" />
        </div>

        <div class="flex">
          <label for="issueType" class="inline-block w-1/2 m-1">
            Issue Type
          </label>
          <input id="issueType" type="number" class="bg-white w-1/2 m-1 p-1 rounded" value="1" />
        </div>

        <div class="flex">
          <label for="priority" class="inline-block w-1/2 m-1">
            Priority
          </label>
          <select id="priority" class="bg-white w-1/2 m-1 p-1 rounded">
            <option value="1">Highest</option>
            <option value="2">High</option>
            <option value="3" selected>Medium</option>
            <option value="4">Low</option>
            <option value="5">Lowest</option>
          </select>
        </div>

        <div class="flex">
          <label for="summary" class="inline-block w-1/2 m-1">
            Summary
          </label>
          <input id="summary" type="text" class="bg-white w-1/2 m-1 p-1 rounded" />
        </div>

        <div>
          <label for="description" class="inline-block w-1/2 m-1">
            Description
          </label>
          <textarea id="description" class="bg-white w-full h-64 m-1 p-1 rounded"></textarea>
        </div>
      </section>

      <section class="p-2">
        <h2 class="text-xl p-2">Output</h2>

        <div class="flex">
          <span class="inline-block w-1/2 m-1"></span>
          <button
            class="bg-slate-900 text-white rounded w-1/2 m-1"
            onclick="generateButtonOnClick()"
            >Generate</button>
        </div>

        <div>
          <input id="output" type="text" class="bg-white w-full m-1 p-1 rounded" readonly />
        </div>
      </section>

    </div>

    <footer class="w-2/3 text-center">
      Copyright (C) 2022
      <a href="https://github.com/jiro4989">jiro4989</a>
      |
      <a href="https://github.com/jiro4989/jira_issue_url_generator">Repository</a>
    </footer>
  </body>
</html>
