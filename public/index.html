<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.1.13/index.global.js"
      integrity="sha512-RAOoTi4JqATUmfyj+oyxwAo3JtUeZwLsBpNisDcY5VzvXZARuuaE5zfwUCDVa2LBBUax70uBlO4+eZA1Y/tk0A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      ></script>
    <title>JIRA ISSUE URL GENERATOR</title>
  </head>
  <body>
    <script type="module">
      import { sushi } from './utils.js';
      console.log(sushi());
    </script>
    <header>
      <h1>JIRA ISSUE URL GENERATOR</h1>
    </header>

    <section>
      <h2>Input</h2>
      <label for="param">
        Set parameters from JIRA URL
        <input id="param" type="text" />
      </label>
      <label for="base_url">
        Jira Base URL
        <input id="base_url" type="text" />
      </label>
      <p class="w-4">
        <label for="project_id">
          Project ID
          <input id="project_id" type="number" />
        </label>
      </p>
      <p class="w-4">
        <label for="issue_type">
          Issue Type
          <input id="issue_type" type="number" />
        </label>
      </p>
      <p class="w-4">
        <label for="priority">
          Priority
          <input id="priority" type="text" />
        </label>
      </p>
      <label for="summary">
        Summary
        <input id="summary" type="text" />
      </label>
      <label for="description">
        Description
        <input id="description" type="textarea" />
      </label>
    </section>

    <section>
      <h2>Output</h2>
    </section>

    <footer>
      Copyright (C) 2022
      <a href="https://github.com/jiro4989">jiro4989</a>
      |
      <a href="https://github.com/jiro4989/jira_issue_url_generator">Repository</a>
    </footer>
  </body>
</html>
